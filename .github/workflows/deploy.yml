name: Deploy wedding site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build with the wishes endpoint
        env:
          ASTRO_SITE: ${{ vars.SITE_URL }}
          ASTRO_BASE: /
          PUBLIC_WISHES_ENDPOINT: ${{ vars.PUBLIC_WISHES_ENDPOINT }}
        run: |
          test -n "${ASTRO_SITE}"
          test -n "${PUBLIC_WISHES_ENDPOINT}"
          npm run build
          grep -Fq -- "${PUBLIC_WISHES_ENDPOINT}" dist/index.html
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.118.0'
          command: deploy
